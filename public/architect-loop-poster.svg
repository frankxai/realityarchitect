<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Reality Architect loop poster</title>
  <desc id="desc">A blueprint poster showing the five-step Architect Loop.</desc>
  <rect width="1200" height="760" fill="#06070c"/>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#5b8cff" stroke-opacity=".08"/></pattern>
  <rect width="1200" height="760" fill="url(#grid)"/>
  <circle cx="600" cy="380" r="220" fill="#5b8cff" opacity=".08"/>
  <circle cx="600" cy="380" r="250" fill="none" stroke="#5b8cff" stroke-opacity=".35" stroke-width="3"/>
  <g font-family="Inter, Arial" fill="#e8eaf2" font-weight="700">
    <text x="150" y="140" fill="#969cb2" font-size="18" letter-spacing="5">ARCHITECT LOOP</text>
    <text x="150" y="184" font-size="38">See · Design · Build · Automate · Compound</text>
    <circle cx="600" cy="130" r="52" fill="#0d0f18" stroke="#5b8cff"/>
    <circle cx="838" cy="303" r="52" fill="#0d0f18" stroke="#a78bfa"/>
    <circle cx="747" cy="583" r="52" fill="#0d0f18" stroke="#5b8cff"/>
    <circle cx="453" cy="583" r="52" fill="#0d0f18" stroke="#a78bfa"/>
    <circle cx="362" cy="303" r="52" fill="#0d0f18" stroke="#5b8cff"/>
    <text x="580" y="138" font-size="18">SEE</text>
    <text x="807" y="311" font-size="18">DESIGN</text>
    <text x="721" y="591" font-size="18">BUILD</text>
    <text x="410" y="591" font-size="18">AUTO</text>
    <text x="318" y="311" font-size="18">COMPOUND</text>
  </g>
</svg>
