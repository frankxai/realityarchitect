# Grouped monthly 2026-10-19 (Week 43 inflow throttle).
version: 2
updates:
- package-ecosystem: npm
  directory: /
  schedule:
    interval: monthly
    time: "06:00"
    timezone: Europe/Berlin
  open-pull-requests-limit: 3
  groups:
    minor-and-patch:
      update-types:
      - minor
      - patch
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: monthly
  groups:
    github-actions:
      patterns:
      - "*"
  open-pull-requests-limit: 3
